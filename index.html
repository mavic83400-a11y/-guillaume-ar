<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Guillaume AR — test</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}.hint{position:fixed;z-index:10;left:50%;top:18px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:12px;font:600 15px system-ui;text-align:center;box-shadow:0 2px 12px #0006}.ok{display:none;position:fixed;z-index:11;left:50%;bottom:30px;transform:translateX(-50%);background:#fff;color:#111;padding:12px 16px;border-radius:12px;font:700 16px system-ui}.ok.show{display:block}</style>
</head><body>
<div class="hint">Visez le magnet Guillaume</div><div id="ok" class="ok">Guillaume reconnu ✓</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF:0.001; filterBeta:0.01; missTolerance:5; warmupTolerance:5" color-space="sRGB" renderer="colorManagement:true,physicallyCorrectLights" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0">
  <a-ring color="#ffffff" radius-inner="0.43" radius-outer="0.46" position="0 0 0.03" animation="property:rotation;to:0 0 360;dur:5000;loop:true;easing:linear"></a-ring>
  <a-text value="GUILLAUME RECONNU" align="center" color="#ffffff" width="1.25" position="0 -0.58 0.04"></a-text>
</a-entity></a-scene>
<script>const t=document.querySelector('#target'),o=document.querySelector('#ok');t.addEventListener('targetFound',()=>o.classList.add('show'));t.addEventListener('targetLost',()=>o.classList.remove('show'));</script>
</body></html>
